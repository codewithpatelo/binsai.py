[tool.poetry]
name = "binsai"
version = "0.0.1"
description = "Bio-Inspired Neuro-Symbolic AI — give agents motivations, not just capabilities"
authors = ["Patricio Gerpe <pj.patriciojulian@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/codewithpatelo/binsai.py"
documentation = "https://binsai.readthedocs.io"
homepage = "https://github.com/codewithpatelo/binsai.py"
keywords = ["ai", "agents", "llm", "neuro-symbolic", "drives", "homeostasis", "proactivity", "regulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
packages = [{include = "binsai", from = "src"}]
include = [
    {path = "src/binsai/web/static", format = "sdist"},
]

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.0.0"
python-dotenv = "^1.0.0"

# Web demo (optional — install with binsai[web])
fastapi = {version = "^0.122.0", optional = true}
uvicorn = {extras = ["standard"], version = "^0.38.0", optional = true}
websockets = {version = "^15.0.1", optional = true}

# Analysis / plotting (optional — install with binsai[analysis])
matplotlib = {version = "^3.7.0", optional = true}
pandas = {version = "^2.0.0", optional = true}

[tool.poetry.extras]
web = ["fastapi", "uvicorn", "websockets"]
analysis = ["matplotlib", "pandas"]
all = ["fastapi", "uvicorn", "websockets", "matplotlib", "pandas"]

[tool.poetry.scripts]
binsai = "binsai.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
pytest-cov = "^4.1.0"
python-dotenv = "^1.0.0"
openai = "^1.0.0"
fastapi = "^0.122.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
websockets = "^15.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-m 'not llm'"
markers = [
    "llm: tests that call real LLM APIs (require DEEPSEEK_API_KEY)",
]
